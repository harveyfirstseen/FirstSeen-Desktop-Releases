name: Build FirstSeen Phone HTML

on:
  push:
    branches:
      - main
    paths:
      - phone-build-request.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build phone HTML
        shell: python
        run: |
          import pathlib, re, shutil, subprocess
          root = pathlib.Path(".")
          src = root / "phone-source" / "v4.3"
          work = root / ".phone-build"
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()
          for name in ("index.html","app.css","app.js"):
              shutil.copy2(src / name, work / name)

          app = work / "app.js"
          s = app.read_text(encoding="utf-8")
          anchor = "  function messageModal(id){\n"
          helper = "  function openNativeMessages(id){\\n    const l=leadById(id);\\n    if(!l)return;\\n    if(!l.phone)return alert(\`No phone number is saved for \${l.business}.\`);\\n    const body=outreachMessage(l);\\n    location.href=smsHref(l.phone,body);\\n  }\\n"
          if anchor not in s:
              raise SystemExit("message modal anchor missing")
          s = s.replace(anchor, helper + anchor, 1)

          old = "    document.querySelectorAll('[data-message]').forEach(b=>b.onclick=e=>{e.stopPropagation();messageModal(b.dataset.message)});"
          new = "    document.querySelectorAll('[data-message]').forEach(b=>b.onclick=e=>{e.stopPropagation();openNativeMessages(b.dataset.message)});"
          if old not in s:
              raise SystemExit("main message handler anchor missing")
          s = s.replace(old, new, 1)

          old = "    document.querySelectorAll('#leadDrawer [data-message]').forEach(b=>b.onclick=()=>messageModal(b.dataset.message));"
          new = "    document.querySelectorAll('#leadDrawer [data-message]').forEach(b=>b.onclick=()=>openNativeMessages(b.dataset.message));"
          if old not in s:
              raise SystemExit("drawer message handler anchor missing")
          s = s.replace(old, new, 1)

          app.write_text(s, encoding="utf-8")
          subprocess.run(["node","--check",str(app)], check=True)

          html = (work/"index.html").read_text(encoding="utf-8")
          css = (work/"app.css").read_text(encoding="utf-8")
          js = app.read_text(encoding="utf-8")
          html = re.sub(r'<link[^>]+href=["\'](?:\./)?app\.css["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'<script[^>]+src=["\'](?:\./)?app\.js["\'][^>]*>\s*</script>', '', html, flags=re.I)
          html = html.replace("</head>", "<style>\n"+css+"\n</style>\n</head>", 1)
          html = html.replace("</body>", "<script>\n"+js+"\n</script>\n</body>", 1)

          out = root / "phone"
          out.mkdir(exist_ok=True)
          target = out / "FirstSeen_CRM_Phone_V1.html"
          target.write_text(html, encoding="utf-8")

          final = target.read_text(encoding="utf-8")
          required = [
              "function openNativeMessages(id)",
              "location.href=smsHref(l.phone,body)",
              "openNativeMessages(b.dataset.message)",
              "function smsHref(phone,body)",
              "function outreachMessage(l)"
          ]
          missing=[x for x in required if x not in final]
          if missing:
              raise SystemExit("regression check failed: "+", ".join(missing))
          print("Phone V1 HTML built and syntax checked")

      - name: Commit phone HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phone/FirstSeen_CRM_Phone_V1.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build FirstSeen CRM Phone V1 native SMS handoff"
          git push
